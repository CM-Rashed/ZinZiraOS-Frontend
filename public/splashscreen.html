<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZinziraOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Glassmorphic Container */
    .card {
      position: relative;
      width: 440px;
      height: 320px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  0 0 50px rgba(168, 85, 247, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      opacity: 0;
      transform: scale(0.94);
      animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      overflow: hidden;
    }

    /* Animated Rim Glow */
    .card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(168, 85, 247, 0.4) 180deg,
        transparent 360deg
      );
      animation: rotateGlow 6s linear infinite;
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Multi-layered Ambient Backlight */
    .glow-primary {
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(99, 102, 241, 0) 70%);
      top: 10%;
      filter: blur(35px);
      z-index: 1;
      animation: pulse 3s infinite alternate ease-in-out;
    }

    .glow-secondary {
      position: absolute;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: 10%;
      filter: blur(30px);
      z-index: 1;
    }

    /* Premium Logo Badge */
    .logo-box {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(168, 85, 247, 0.45),
                  inset 0 1px 1px rgba(255, 255, 255, 0.4);
      margin-bottom: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo-icon {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* App Title & Subtitle */
    .title {
      color: #f8fafc;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.6px;
      margin-bottom: 6px;
    }

    .title .accent {
      color: #c084fc;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      margin-bottom: 28px;
    }

    /* Precision Progress Indicator */
    .progress-wrapper {
      width: 78%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7, #c084fc);
      border-radius: 99px;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
      animation: fillProgress 2.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.85; }
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fillProgress {
      0% { width: 0%; }
      30% { width: 45%; }
      70% { width: 80%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow-primary"></div>
    <div class="glow-secondary"></div>
    
    <div class="card-inner">
      <div class="logo-box">
        <span class="logo-icon">Z</span>
      </div>
      
      <div class="title">Computer<span class="accent">City</span></div>
      <div class="subtitle">Initialising Computer City</div>
      
      <div class="progress-wrapper">
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
