<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Glassmorphic Container */
    .card {
      position: relative;
      width: 420px;
      height: 300px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      opacity: 0;
      transform: scale(0.95);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Ambient Glow Effect */
    .glow {
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(99, 102, 241, 0) 70%);
      top: 15%;
      filter: blur(30px);
      z-index: 0;
      animation: pulse 2.5s infinite alternate ease-in-out;
    }

    /* Logo Icon */
    .logo-box {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
      margin-bottom: 24px;
    }

    .logo-box svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
    }

    /* App Title & Subtitle */
    .title {
      position: relative;
      z-index: 1;
      color: #f8fafc;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      margin-bottom: 28px;
    }

    /* Sleek Progress Bar */
    .progress-track {
      position: relative;
      z-index: 1;
      width: 80%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 99px;
      animation: fillProgress 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Animations */
    @keyframes fadeIn {
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 0.9; }
    }

    @keyframes fillProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="logo-box">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="title">Apex Studio</div>
    <div class="subtitle">Initialising core modules...</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
